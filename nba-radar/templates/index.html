<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NBA Radar</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">PERSONAL NBA TREND MONITOR</div>
        <h1>🏀 NBA Radar</h1>
        <p>新闻、梗、收藏分开看。中文翻译 {{ '已开启' if translation_enabled else '未开启' }}。<span class="manual-mode">启动抓取一次 · 后续仅手动</span></p>
      </div>
      <button id="refreshBtn" class="primary">立即抓取</button>
    </header>

    <nav class="section-tabs" id="categoryTabs">
      <button data-category="news" class="section-tab active">
        <span class="tab-icon">📰</span>
        <span><strong>NBA 新闻</strong><small>RSS + YouTube 新闻频道</small></span>
      </button>
      <button data-category="meme" class="section-tab">
        <span class="tab-icon">😂</span>
        <span><strong>NBA 梗 / 二创</strong><small>Reddit + YouTube 梗视频</small></span>
      </button>
      <button data-category="favorite" class="section-tab">
        <span class="tab-icon">⭐</span>
        <span><strong>我的收藏</strong><small>灵感 + 人工风险检查</small></span>
      </button>
    </nav>

    <section class="risk-rule card">
      <strong>发布前规则：</strong>
      <span>优先检查暴力、低俗、歧视、谣言 / 误导等风险；拿不准时标记「待群内确认」，不要硬判。</span>
    </section>

    <section class="controls card">
      <div class="control-group">
        <span>来源</span>
        <div class="chips" id="sourceChips"></div>
      </div>
      <div class="control-group" id="timeGroup">
        <span>时间</span>
        <div class="chips" id="timeChips">
          <button data-hours="3" class="chip">3小时</button>
          <button data-hours="12" class="chip">12小时</button>
          <button data-hours="24" class="chip active">24小时</button>
          <button data-hours="72" class="chip">3天</button>
          <button data-hours="168" class="chip">7天</button>
        </div>
      </div>
      <div class="control-group">
        <span>排序</span>
        <div class="chips" id="sortChips">
          <button data-sort="latest" class="chip active">最新</button>
          <button data-sort="hot" class="chip">热度</button>
        </div>
      </div>
      <div class="meta" id="meta">正在载入…</div>
    </section>

    <section class="diagnostics card">
      <div class="diagnostics-head">
        <div>
          <strong>抓取诊断</strong>
          <span id="diagnosticSummary">尚未有抓取记录</span>
        </div>
        <span class="diagnostic-help">“成功 · 无新增”= 抓取正常；“安全跳过”= 本次没有向该来源发请求</span>
      </div>
      <div id="diagnosticGrid" class="diagnostic-grid"></div>
    </section>

    <section id="feed" class="feed"></section>
    <section id="empty" class="empty card" hidden>
      <h2>暂时没有内容</h2>
      <p id="emptyHint">如果你刚启动程序，点一次“立即抓取”。</p>
    </section>
  </main>
<script>
const state = { category: 'news', source: 'all', hours: 24, sort: 'latest' };
const feed = document.querySelector('#feed');
const empty = document.querySelector('#empty');
const emptyHint = document.querySelector('#emptyHint');
const meta = document.querySelector('#meta');
const refreshBtn = document.querySelector('#refreshBtn');
const sourceChips = document.querySelector('#sourceChips');
const timeGroup = document.querySelector('#timeGroup');
const diagnosticGrid = document.querySelector('#diagnosticGrid');
const diagnosticSummary = document.querySelector('#diagnosticSummary');

const sourcesByCategory = {
  news: [['all','全部'],['rss','新闻 RSS'],['youtube','YouTube']],
  meme: [['all','全部'],['reddit','Reddit'],['youtube','YouTube']],
  favorite: [['all','全部'],['reddit','Reddit'],['youtube','YouTube'],['rss','新闻 RSS']]
};
const riskLabels = {
  unreviewed: ['未评估','neutral'],
  green: ['绿灯','green'],
  yellow: ['黄灯','yellow'],
  red: ['红灯','red'],
  group_check: ['待群内确认','group']
};
const riskTagOptions = ['暴力','低俗','歧视','谣言','误导','伤病/身体','其他'];

function esc(s='') { return String(s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
function number(n) { return new Intl.NumberFormat('zh-CN', {notation:'compact', maximumFractionDigits:1}).format(Number(n||0)); }
function age(iso) {
  const d = new Date(iso), sec = Math.max(0, (Date.now()-d.getTime())/1000);
  if (sec < 60) return `${Math.floor(sec)}秒前`;
  if (sec < 3600) return `${Math.floor(sec/60)}分钟前`;
  if (sec < 86400) return `${Math.floor(sec/3600)}小时前`;
  return d.toLocaleDateString('zh-CN');
}
function badge(source) { return ({rss:'NEWS',youtube:'YOUTUBE',reddit:'REDDIT'})[source] || source.toUpperCase(); }
function metrics(item) {
  const m = item.metrics || {}, parts = [];
  if (m.view_count) parts.push(`▶ ${number(m.view_count)}`);
  if (m.like_count) parts.push(`♥ ${number(m.like_count)}`);
  if (m.comment_count) parts.push(`💬 ${number(m.comment_count)}`);
  if (m.score) parts.push(`↑ ${number(m.score)}`);
  return parts.join(' · ');
}
function riskPill(level='unreviewed') {
  const [label, cls] = riskLabels[level] || riskLabels.unreviewed;
  return `<span class="risk-pill ${cls}">${label}</span>`;
}
function timeOnly(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}
function diagnosticLabel(row) {
  if (row.status === 'disabled') return ['未启用','disabled'];
  if (row.status === 'cooldown') return ['冷却中','cooldown'];
  if (row.status === 'guarded') return ['安全跳过','guarded'];
  if (row.status === 'error') {
    if ((row.message || '').includes('429') || (row.message || '').includes('限流')) return ['被限流','error'];
    return ['失败','error'];
  }
  if (row.status === 'partial') return ['部分成功','partial'];
  if (Number(row.inserted_count || 0) > 0) return [`成功 · +${row.inserted_count}`,'new'];
  return ['成功 · 无新增','ok'];
}
function renderDiagnostics(rows=[]) {
  if (!rows.length) {
    diagnosticSummary.textContent = '尚未有抓取记录';
    diagnosticGrid.innerHTML = '<div class="diagnostic-empty">点一次“立即抓取”后，这里会显示每个来源是否成功。</div>';
    return;
  }
  const errors = rows.filter(x => x.status === 'error').length;
  const partial = rows.filter(x => x.status === 'partial').length;
  const disabled = rows.filter(x => x.status === 'disabled').length;
  const cooldown = rows.filter(x => x.status === 'cooldown').length;
  const guarded = rows.filter(x => x.status === 'guarded').length;
  const newest = rows.map(x => x.attempted_at).filter(Boolean).sort().at(-1);
  const extras = [];
  if (errors) extras.push(`${errors} 个失败`);
  if (partial) extras.push(`${partial} 个部分成功`);
  if (disabled) extras.push(`${disabled} 个未启用`);
  if (cooldown) extras.push(`${cooldown} 个冷却中`);
  if (guarded) extras.push(`${guarded} 个安全跳过`);
  diagnosticSummary.textContent = `上次尝试 ${timeOnly(newest)}${extras.length ? ' · ' + extras.join(' · ') : ' · 全部来源已响应'}`;
  diagnosticGrid.innerHTML = rows.map(row => {
    const [label, cls] = diagnosticLabel(row);
    const count = (row.status === 'disabled' || row.status === 'cooldown' || row.status === 'guarded')
      ? '本次未发起请求'
      : `读取 ${Number(row.fetched_count || 0)} 条 · 新增 ${Number(row.inserted_count || 0)} 条`;
    const detail = row.message ? `<div class="diagnostic-message">${esc(row.message)}</div>` : '';
    const group = row.group_name === 'meme' ? '梗' : '新闻';
    return `<div class="diagnostic-row">
      <div class="diagnostic-source"><span class="diag-group">${group}</span><strong>${esc(row.display_name)}</strong></div>
      <div class="diag-status ${cls}">${esc(label)}</div>
      <div class="diagnostic-count">${count}</div>
      <div class="diagnostic-time">${timeOnly(row.attempted_at)}</div>
      ${detail}
    </div>`;
  }).join('');
}
function reviewPanel(item) {
  const level = item.risk_level || 'unreviewed';
  const tags = item.risk_tags || [];
  const riskButtons = Object.entries(riskLabels).map(([value,[label,cls]]) =>
    `<button type="button" class="risk-choice ${cls} ${level===value?'active':''}" data-risk="${value}">${label}</button>`
  ).join('');
  const tagBoxes = riskTagOptions.map(tag =>
    `<label class="risk-tag"><input type="checkbox" value="${esc(tag)}" ${tags.includes(tag)?'checked':''}> ${esc(tag)}</label>`
  ).join('');
  return `<div class="review-panel" data-review-id="${item.id}">
    <div class="review-head"><strong>人工风险检查</strong><span>这里只记录你的判断，不做 AI 自动定性。</span></div>
    <div class="review-row"><span class="review-label">结论</span><div class="risk-choices">${riskButtons}</div></div>
    <div class="review-row"><span class="review-label">风险点</span><div class="risk-tags">${tagBoxes}</div></div>
    <div class="review-row notes-row"><span class="review-label">备注</span><textarea class="risk-notes" placeholder="例如：可以玩 free-throw / whistle 梗，但不要写成裁判受贿或联盟操控。">${esc(item.risk_notes || '')}</textarea></div>
    <div class="review-actions"><span class="save-status"></span><button type="button" class="save-review">保存风险记录</button></div>
  </div>`;
}
function card(item) {
  const zhTitle = item.title_zh || '';
  const titleMain = zhTitle || item.title;
  const original = zhTitle ? `<div class="original">${esc(item.title)}</div>` : '';
  const summary = item.summary_zh || item.summary || '';
  const thumb = item.thumbnail_url ? `<a class="thumb-wrap" href="${esc(item.url)}" target="_blank" rel="noopener"><img class="thumb" src="${esc(item.thumbnail_url)}" alt="" loading="lazy"></a>` : '';
  const metricText = metrics(item);
  const categoryMark = item.category === 'meme' ? '<span class="kind meme">梗</span>' : '<span class="kind news">新闻</span>';
  const favText = item.favorite ? '★ 已收藏' : '☆ 收藏灵感';
  const review = state.category === 'favorite' ? reviewPanel(item) : '';
  return `<article class="story card ${item.category}" data-item-id="${item.id}">
    ${thumb}
    <div class="story-body">
      <div class="story-top">
        <span class="source ${item.source}">${badge(item.source)}</span>${categoryMark}
        ${item.favorite ? riskPill(item.risk_level) : ''}
        <span>${esc(item.source_name || '')}</span><span>·</span><span>${esc(item.author || '')}</span>
        <span class="grow"></span><span>${age(item.published_at)}</span>
      </div>
      <a class="headline" href="${esc(item.url)}" target="_blank" rel="noopener">${esc(titleMain)}</a>
      ${original}
      ${summary ? `<p class="summary">${esc(summary)}</p>` : ''}
      <div class="story-foot">
        <span>${metricText || ' '}</span>
        <div class="story-links"><button type="button" class="favorite-btn ${item.favorite?'saved':''}" data-favorite="${item.favorite?'0':'1'}">${favText}</button><a href="${esc(item.url)}" target="_blank" rel="noopener">打开原内容 ↗</a></div>
      </div>
      ${review}
    </div>
  </article>`;
}
function renderSources() {
  const options = sourcesByCategory[state.category];
  if (!options.some(([value]) => value === state.source)) state.source = 'all';
  sourceChips.innerHTML = options.map(([value,label]) =>
    `<button data-source="${value}" class="chip ${state.source===value?'active':''}">${label}</button>`
  ).join('');
  sourceChips.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
    state.source = btn.dataset.source; renderSources(); load();
  }));
}
function updateControls() {
  timeGroup.hidden = state.category === 'favorite';
}
async function load() {
  meta.textContent = '正在更新页面…';
  try {
    const qs = new URLSearchParams({category:state.category, source:state.source, hours:state.hours, sort:state.sort});
    const r = await fetch(`/api/items?${qs}`), data = await r.json();
    if (!r.ok) throw new Error('api items failed');
    renderDiagnostics(data.source_statuses || []);
    feed.innerHTML = data.items.map(card).join('');
    empty.hidden = data.items.length > 0;
    if (!data.items.length) {
      emptyHint.textContent = state.category === 'favorite'
        ? '还没有收藏。去新闻或梗区点“收藏灵感”即可。'
        : state.category === 'meme'
          ? 'Reddit 梗区建议配置 Reddit OAuth；YouTube 梗视频需要配置 YOUTUBE_API_KEY。可以先点“立即抓取”。'
          : '新闻 RSS 不需要 API Key；YouTube 新闻需要配置 YOUTUBE_API_KEY。可以先点“立即抓取”。';
    }
    const last = data.stats.last_attempt ? new Date(data.stats.last_attempt).toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'}) : '尚未抓取';
    const catN = state.category === 'news' ? (data.stats.news_n || 0) : state.category === 'meme' ? (data.stats.meme_n || 0) : (data.stats.favorite_n || 0);
    const label = state.category === 'news' ? '新闻' : state.category === 'meme' ? '梗' : '收藏';
    meta.textContent = `${data.items.length} 条当前结果 · ${label}库共 ${catN} 条 · 最近抓取尝试 ${last}`;
  } catch (e) {
    meta.textContent = '读取失败'; empty.hidden = false;
  }
}
async function patchItem(id, payload) {
  const r = await fetch(`/api/items/${id}/review`, {
    method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)
  });
  if (!r.ok) throw new Error('save failed');
  return r.json();
}
async function refresh() {
  refreshBtn.disabled = true; refreshBtn.textContent = '检查频率…';
  let payload = {};
  try {
    const checkResp = await fetch('/api/refresh-check');
    const check = await checkResp.json();
    if (!checkResp.ok || !check.ok) throw new Error('refresh check failed');

    const warnings = check.warnings || [];
    if (warnings.length) {
      const hasReddit = warnings.some(w => w.kind.startsWith('reddit_'));
      const hasYoutube = warnings.some(w => w.kind === 'youtube_quota');
      const details = warnings.map(w => `• ${w.message}`).join('\n');
      const decision = window.confirm(
        `⚠️ 抓取频率提醒\n\n${details}\n\n` +
        `其中 Reddit 的“接近上限”提醒会参考 OAuth 返回的速率信息；其余仍属于本地保守提醒。\n\n` +
        `点“确定”：仍然抓取这些来源（冷却中的 Reddit 仍会自动跳过）。\n` +
        `点“取消”：继续抓其他安全来源，但跳过本次有风险的来源。`
      );
      if (decision) {
        payload.force_reddit = hasReddit;
      } else {
        payload.skip_reddit = hasReddit;
        payload.skip_youtube = hasYoutube;
      }
    }

    refreshBtn.textContent = '抓取中…';
    diagnosticSummary.textContent = '正在逐个检查来源…';
    const r = await fetch('/api/refresh', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    const data = await r.json();
    if (!r.ok || !data.ok) throw new Error(data.error || 'refresh failed');
    renderDiagnostics(data.source_statuses || []);
  } catch (e) {
    diagnosticSummary.textContent = '抓取请求本身失败，请看 CMD 窗口错误';
  } finally {
    refreshBtn.disabled = false; refreshBtn.textContent = '立即抓取'; await load();
  }
}
function bind(group, key, attr) {
  document.querySelectorAll(group+' button').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll(group+' button').forEach(x => x.classList.remove('active'));
    btn.classList.add('active'); state[key] = btn.dataset[attr];
    if (key === 'hours') state[key] = Number(state[key]); load();
  }));
}

document.querySelectorAll('#categoryTabs button').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('#categoryTabs button').forEach(x => x.classList.remove('active'));
  btn.classList.add('active'); state.category = btn.dataset.category; state.source = 'all';
  if (state.category === 'meme') state.hours = 72;
  if (state.category === 'news') state.hours = 24;
  document.querySelectorAll('#timeChips button').forEach(x => x.classList.toggle('active', Number(x.dataset.hours) === state.hours));
  renderSources(); updateControls(); load();
}));

feed.addEventListener('click', async (e) => {
  const story = e.target.closest('.story');
  if (!story) return;
  const id = Number(story.dataset.itemId);
  const fav = e.target.closest('.favorite-btn');
  if (fav) {
    fav.disabled = true;
    try { await patchItem(id, {favorite: fav.dataset.favorite === '1'}); await load(); }
    catch { fav.disabled = false; alert('收藏保存失败'); }
    return;
  }
  const riskBtn = e.target.closest('.risk-choice');
  if (riskBtn) {
    const panel = riskBtn.closest('.review-panel');
    panel.querySelectorAll('.risk-choice').forEach(x => x.classList.remove('active'));
    riskBtn.classList.add('active');
    return;
  }
  const save = e.target.closest('.save-review');
  if (save) {
    const panel = save.closest('.review-panel');
    const active = panel.querySelector('.risk-choice.active');
    const risk_tags = [...panel.querySelectorAll('.risk-tag input:checked')].map(x => x.value);
    const risk_notes = panel.querySelector('.risk-notes').value;
    const status = panel.querySelector('.save-status');
    save.disabled = true; status.textContent = '保存中…';
    try {
      await patchItem(id, {risk_level: active ? active.dataset.risk : 'unreviewed', risk_tags, risk_notes});
      status.textContent = '已保存';
      setTimeout(load, 450);
    } catch {
      status.textContent = '保存失败'; save.disabled = false;
    }
  }
});

renderSources(); updateControls();
bind('#timeChips','hours','hours'); bind('#sortChips','sort','sort');
refreshBtn.addEventListener('click', refresh);
load(); setInterval(load, 60000);
</script>
</body>
</html>
